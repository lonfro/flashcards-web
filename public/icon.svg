<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Back Card (Tilted) -->
  <g transform="translate(256, 256) rotate(-8) translate(-256, -256)" filter="url(#shadow)">
    <rect x="120" y="110" width="272" height="190" rx="24" fill="#1e1b4b" stroke="#6366f1" stroke-width="4" stroke-opacity="0.6"/>
    <rect x="156" y="150" width="130" height="16" rx="8" fill="#818cf8" fill-opacity="0.4"/>
    <rect x="156" y="180" width="200" height="12" rx="6" fill="#818cf8" fill-opacity="0.25"/>
  </g>

  <!-- Middle Card (Tilted) -->
  <g transform="translate(256, 256) rotate(6) translate(-256, -256)" filter="url(#shadow)">
    <rect x="120" y="150" width="272" height="190" rx="24" fill="#2e1065" stroke="#a855f7" stroke-width="4" stroke-opacity="0.6"/>
    <rect x="156" y="190" width="140" height="16" rx="8" fill="#c084fc" fill-opacity="0.4"/>
    <rect x="156" y="220" width="190" height="12" rx="6" fill="#c084fc" fill-opacity="0.25"/>
  </g>

  <!-- Front Card (Hero) -->
  <g filter="url(#shadow)">
    <rect x="110" y="190" width="292" height="200" rx="24" fill="#0f172a" stroke="url(#cardGrad1)" stroke-width="5"/>
    
    <!-- Header Accent Bar -->
    <rect x="110" y="190" width="292" height="12" rx="6" fill="url(#cardGrad1)"/>

    <!-- Card Content Placeholder lines -->
    <rect x="146" y="235" width="120" height="16" rx="8" fill="url(#cardGrad1)"/>
    <rect x="146" y="268" width="220" height="12" rx="6" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="146" y="292" width="180" height="12" rx="6" fill="#94a3b8" fill-opacity="0.3"/>

    <!-- Card Flip / Sparkle Icon -->
    <g transform="translate(325, 310)">
      <circle cx="28" cy="28" r="28" fill="url(#cardGrad2)" />
      <path d="M28 16 L31 24 L39 25 L33 31 L35 39 L28 35 L21 39 L23 31 L17 25 L25 24 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
